---
name: Auto Tag

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "*.md"
      - "LICENSE*"
      - ".gitignore"

# The tag is pushed with TAG_PUSH_TOKEN; the job token only reads.
permissions:
  contents: read

jobs:
  tag:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/auto-tag-reusable.yml@master
    with:
      mode: patch
    secrets:
      TAG_PUSH_TOKEN: ${{ secrets.TAG_PUSH_TOKEN }}
