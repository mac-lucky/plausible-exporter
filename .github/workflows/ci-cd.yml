---
name: CI/CD Pipeline - Plausible Exporter

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: write
  packages: write
  security-events: write
  actions: read

jobs:
  ci-cd:
    uses: mac-lucky/actions-shared-workflows/.github/workflows/go-cicd-reusable.yml@fix/go-toolchain-latest-patch
    with:
      app_name: "plausible-exporter"
      dockerhub_image: "maclucky/plausible-exporter"
      ghcr_image: "ghcr.io/mac-lucky/plausible-exporter"
      main_branch: "main"

      dockerfile_path: "./Dockerfile"
      build_context: "."

      enable_go_tests: true

      enable_container_tests: false
      enable_kubernetes_tests: false

      enable_security_scan: true
      enable_sbom: true

      # DOCKER_HUB_USERNAME/DOCKER_HUB_PASSWORD are not set on this repo yet,
      # so pushing here fails the whole per-arch build job (login is a
      # blocking step ahead of the GHCR push). Flip to true once the secrets
      # exist.
      push_to_dockerhub: false
    secrets:
      DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
      DOCKER_HUB_PASSWORD: ${{ secrets.DOCKER_HUB_PASSWORD }}
